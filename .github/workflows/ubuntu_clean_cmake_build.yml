# Copied from github marketplace (Cmake)
name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install required packages
      run: sudo add-apt-repository ppa:nnstreamer/ppa && sudo apt update && sudo apt install libpaho-mqtt-dev libglib2.0-dev libgtest-dev

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DENABLE_TEST=ON

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.  
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure --no-tests=error

    # The AddressSanitizer run lives in this job rather than a job of its own so
    # that it is covered by the "build" required status check; a leak detected
    # here blocks the merge instead of only turning a non-required job red.
    - name: Configure CMake with AddressSanitizer
      run: >
        cmake -B ${{github.workspace}}/build-asan -DCMAKE_BUILD_TYPE=Debug -DENABLE_TEST=ON
        -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer"
        -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer"
        -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
        -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address"

    - name: Build with AddressSanitizer
      run: cmake --build ${{github.workspace}}/build-asan

    - name: Test with AddressSanitizer
      working-directory: ${{github.workspace}}/build-asan
      env:
        ASAN_OPTIONS: detect_leaks=1
      run: ctest --output-on-failure --no-tests=error

  build-ubuntu-26-04:
    # Ubuntu 26.04 ships gcc 15, which compiles C as C23 by default. There
    # string.h keeps the constness of the argument of strchr() and strstr(),
    # so a "char *" holding their result fails under -Werror. Its gtest also
    # needs C++17. Neither is caught by the runner image above.
    name: Build and test on Ubuntu 26.04 (gcc 15)
    runs-on: ubuntu-latest
    container: ubuntu:26.04

    steps:
    - uses: actions/checkout@v4

    - name: Install required packages
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential cmake pkg-config libglib2.0-dev libgtest-dev

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DENABLE_TEST=ON

    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure --no-tests=error
