# Copied from github marketplace (Cmake)
name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install required packages
      run: sudo add-apt-repository ppa:nnstreamer/ppa && sudo apt update && sudo apt install libpaho-mqtt-dev libglib2.0-dev libgtest-dev mosquitto

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DENABLE_TEST=ON

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.  
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure --no-tests=error

    # ThreadSanitizer over the concurrency test, in this job for the same reason
    # as AddressSanitizer below. Any report makes the binary exit non-zero, so a
    # flag or field shared between the library threads without a lock or an
    # atomic type fails the check. The runner kernel randomizes mmap with more
    # bits than TSan supports, so the test runs without address space
    # randomization, which holds whatever number of bits a kernel uses.
    - name: Configure CMake with ThreadSanitizer
      run: >
        cmake -B ${{github.workspace}}/build-tsan -DCMAKE_BUILD_TYPE=Debug -DENABLE_TEST=ON
        -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
        -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
        -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
        -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"

    - name: Build with ThreadSanitizer
      run: cmake --build ${{github.workspace}}/build-tsan --target unittest_nnstreamer-edge-thread

    - name: Test with ThreadSanitizer
      working-directory: ${{github.workspace}}/build-tsan
      run: setarch "$(uname -m)" -R ctest -R '^unittest_nnstreamer-edge-thread$' --output-on-failure --no-tests=error

    # The AddressSanitizer run lives in this job rather than a job of its own so
    # that it is covered by the "build" required status check; a leak detected
    # here blocks the merge instead of only turning a non-required job red.
    - name: Configure CMake with AddressSanitizer
      run: >
        cmake -B ${{github.workspace}}/build-asan -DCMAKE_BUILD_TYPE=Debug -DENABLE_TEST=ON
        -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer"
        -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer"
        -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
        -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address"

    - name: Build with AddressSanitizer
      run: cmake --build ${{github.workspace}}/build-asan

    - name: Test with AddressSanitizer
      working-directory: ${{github.workspace}}/build-asan
      env:
        ASAN_OPTIONS: detect_leaks=1
      run: ctest --output-on-failure --no-tests=error

    # No other job builds the Paho MQTT backend, which Android uses: CMake takes
    # libmosquitto whenever it finds it. This job installs the broker but not
    # libmosquitto-dev, so CMake falls back to Paho here.
    - name: Configure CMake with Paho MQTT and AddressSanitizer
      shell: bash
      run: |
        # The version comes with the runner image, so show which one these steps test.
        dpkg-query -W -f='Paho MQTT C under test: ${Version}\n' libpaho-mqtt-dev
        cmake -B ${{github.workspace}}/build-paho -DCMAKE_BUILD_TYPE=Debug -DENABLE_TEST=ON -DMQTT_SUPPORT=ON \
          -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
          -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address" \
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address" 2>&1 | tee paho-configure.log
        # Should libmosquitto-dev ever come in, fail instead of testing mosquitto twice.
        if ! grep -q "Found Paho MQTT" paho-configure.log; then
          echo "::error::CMake did not select the Paho MQTT backend"
          exit 1
        fi

    - name: Build with Paho MQTT and AddressSanitizer
      run: cmake --build ${{github.workspace}}/build-paho

    - name: Start the MQTT broker
      run: |
        # Installing the package normally starts the broker as a service already.
        pgrep -x mosquitto > /dev/null || mosquitto -d -p 1883
        for _ in $(seq 1 30); do
          if (exec 3<>/dev/tcp/127.0.0.1/1883) 2>/dev/null; then
            exit 0
          fi
          sleep 1
        done
        echo "::error::the MQTT broker did not start"
        exit 1

    # Paho records every block it allocates, and the test binary keeps one Paho
    # client for its whole run (see its main()), so LeakSanitizer sees here only
    # what the library itself allocates. Memory that Paho owns, like the received
    # messages of #273, is checked by Paho: with its trace on, it lists what is
    # not freed when its last client is closed.
    # Limits of that check: it needs a Paho built with heap tracking, as the
    # Ubuntu package is; it says nothing when it finds nothing, and it finds
    # nothing in a client that is never destroyed or in 20 bytes or less.
    # Paho can also fail it on its own: a packet it has read for a client that
    # is destroyed meanwhile is not freed. Such a report lists only blocks from
    # MQTTPacket*.c and LinkedList.c, was seen once in 80 loaded runs, and goes
    # away on a rerun.
    - name: MQTT unit test on Paho with AddressSanitizer
      working-directory: ${{github.workspace}}/build-paho
      env:
        ASAN_OPTIONS: detect_leaks=1
        MQTT_C_CLIENT_TRACE: "ON"
        MQTT_C_CLIENT_TRACE_LEVEL: ERROR
      shell: bash
      run: |
        LD_LIBRARY_PATH=./src ./tests/unittest_nnstreamer-edge-mqtt 2>&1 | tee mqtt-test.log
        # A test that does not see the broker returns early and still reports OK.
        if grep -q "MQTT broker is not running" mqtt-test.log; then
          echo "::error::the MQTT tests did not see the broker"
          exit 1
        fi
        if grep -q "Failed to keep a Paho client" mqtt-test.log; then
          echo "::error::the MQTT tests ran without the kept Paho client"
          exit 1
        fi
        # Paho prints this header when its trace is on, which the check below needs.
        if ! grep -q "Trace Output" mqtt-test.log; then
          echo "::error::the trace of Paho is not on"
          exit 1
        fi
        if grep -q "Some memory not freed at shutdown" mqtt-test.log; then
          echo "::error::Paho reports memory it owns that was not freed"
          exit 1
        fi
        # The Paho tests skip themselves on another backend, so check that they ran.
        for t in edgeMqttHybrid.receivedMessagesReleased edgeMqtt.receivedDataReleased; do
          if ! grep -q "\[       OK \] $t " mqtt-test.log; then
            echo "::error::$t did not run and pass on the Paho backend"
            exit 1
          fi
        done

  build-ubuntu-26-04:
    # Ubuntu 26.04 ships gcc 15, which compiles C as C23 by default. There
    # string.h keeps the constness of the argument of strchr() and strstr(),
    # so a "char *" holding their result fails under -Werror. Its gtest also
    # needs C++17. Neither is caught by the runner image above.
    name: Build and test on Ubuntu 26.04 (gcc 15)
    runs-on: ubuntu-latest
    container: ubuntu:26.04

    steps:
    - uses: actions/checkout@v4

    - name: Install required packages
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential cmake pkg-config libglib2.0-dev libgtest-dev libmosquitto-dev mosquitto procps

    - name: Configure CMake
      # MQTT on, as debian/rules builds it, so that source is compiled by gcc 15 too.
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DENABLE_TEST=ON -DMQTT_SUPPORT=ON

    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure --no-tests=error

    # unittest_nnstreamer-edge-mqtt is not registered with ADD_TEST() because it
    # needs a running broker, so the ctest above never runs it. Without a broker
    # every test in that file returns early from _check_mqtt_broker() and passes
    # without asserting anything, so start one and run the binary directly here.
    - name: Start the MQTT broker
      run: |
        mosquitto -d -p 1883
        # _check_mqtt_broker() in the test looks the daemon up with ps, so wait
        # until it is visible there instead of assuming it came up within a fixed
        # delay; a run step exits on the first failing command, so a bare grep
        # that loses the race would fail the job rather than retry.
        for _ in $(seq 1 30); do
          if ps aux | grep "[m]osquitto"; then
            exit 0
          fi
          sleep 1
        done
        echo "::error::the MQTT broker did not start"
        exit 1

    - name: MQTT unit test
      working-directory: build
      run: LD_LIBRARY_PATH=./src ./tests/unittest_nnstreamer-edge-mqtt
